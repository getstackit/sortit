[settings]
experimental = true

[env]
PROJECT_ROOT = "{{ config_root }}"
_.file = ".env"
NEXT_PUBLIC_API_ORIGIN = "http://localhost:8081"
SPLAT_WEB_ORIGIN = "http://localhost:3000"
SPLAT_DATABASE_URL = "postgres://splat:splat@localhost:5432/splat?sslmode=disable"
SPLAT_TEST_DATABASE_URL = "postgres://splat:splat@localhost:5432/splat?sslmode=disable"

[tools]
go = "1.26"
node = "22"
"go:github.com/DarthSim/overmind/v2" = "latest"
"aqua:watchexec/watchexec" = "latest"

[tasks.install]
description = "Install app dependencies"
run = "npm install"

[tasks.compile]
description = "Check Go compilation"
run = "go build ./apps/... ./internal/..."

[tasks.test]
description = "Run Go tests"
run = "go test ./apps/... ./internal/..."

[tasks.lint]
description = "Run ESLint"
run = "npm run lint"

[tasks."web:dev"]
description = "Run the Next.js app in development mode"
run = "npm run dev -- --hostname 0.0.0.0 --port ${APP_PORT:-3000}"

[tasks."dev:server"]
description = "Run the Go API server in development mode"
run = "watchexec -r -e go -w apps/server -w internal -- go run ./apps/server --port ${API_PORT:-8081} --cors ${SPLAT_SERVER_CORS:-http://localhost:3000,http://127.0.0.1:3000}"

[tasks."dev:stop"]
description = "Stop local dev processes bound to the app and API ports"
run = """
  for port in ${APP_PORT:-3000} ${API_PORT:-8081}; do
    pids=$(lsof -ti tcp:$port || true)
    if [ -n "$pids" ]; then
      kill $pids 2>/dev/null || true
      sleep 1
      remaining=$(lsof -ti tcp:$port || true)
      if [ -n "$remaining" ]; then
        kill -9 $remaining 2>/dev/null || true
      fi
    fi
  done
  docker compose down 2>/dev/null || true
  rm -f /tmp/splat-overmind.sock
"""

[tasks."server:build"]
description = "Build the Go API server"
run = """
  mkdir -p bin
  go build -o bin/splat-server ./apps/server
"""

[tasks.build]
description = "Build the frontend and backend"
depends = ["server:build"]
run = "npm run build"

[tasks.dev]
description = "Run the frontend and backend using overmind"
depends = ["dev:stop"]
run = "overmind start --no-port --socket /tmp/splat-overmind.sock -f Procfile.dev"
