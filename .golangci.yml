version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  allow-parallel-runners: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - sortit

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - goconst
    - unconvert
    - unparam
    - gosec
    - revive
    - gocritic
    - nilerr
    - bodyclose
    - prealloc
    - whitespace
    - errorlint
    - copyloopvar
    - tparallel
  settings:
    misspell:
      locale: US
    goconst:
      # Tuned after the golangci-lint 2.12 bump made goconst far noisier.
      # Constants in tests hurt readability, and low-occurrence literals are
      # rarely worth hoisting — only flag strings repeated enough to be a real
      # maintenance risk.
      ignore-tests: true
      min-occurrences: 5
    gosec:
      excludes:
        - G117
        - G204
        - G304
        - G701
        - G702
        - G703
        - G704
    revive:
      rules:
        - name: var-naming
          disabled: true
  exclusions:
    presets: []
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      - path: _test\.go
        linters:
          - lll

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
