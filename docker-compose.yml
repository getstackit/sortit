services:
  postgres:
    image: paradedb/paradedb:latest
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: sortit
      POSTGRES_PASSWORD: sortit
      POSTGRES_DB: sortit
    volumes:
      - pgdata_paradedb18:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sortit"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata_paradedb18:
