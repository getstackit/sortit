services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: splat
      POSTGRES_PASSWORD: splat
      POSTGRES_DB: splat
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splat"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
