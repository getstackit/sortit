services:
  postgres:
    # Pinned to keep local and CI Postgres versions in lockstep.
    # When upgrading, bump CI (.github/workflows/test.yml) at the same time
    # and review docs/development.md for any migration notes.
    image: paradedb/paradedb:0.23.1-pg18
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: sortit
      POSTGRES_PASSWORD: sortit
      POSTGRES_DB: sortit
    volumes:
      - pgdata_paradedb18:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sortit"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata_paradedb18:
